<script>
(function(){
if (typeof THREE === 'undefined' || !window.__WORKER_DATA__) {
  document.getElementById('fallback').style.display = 'flex';
  return;
}

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2f3f5);
const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 100);

scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(3, 5, 4);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.3);
fill.position.set(-4, 2, -3);
scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(3.0, 40),
  new THREE.MeshToonMaterial({ color:0xe9eaec })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* ---- 由内嵌 GLB 数据构建模型 ---- */
const OUTLINE = new THREE.MeshBasicMaterial({ color:0x332a22, side:THREE.BackSide });
function b64ToU8(b64){
  const bin = atob(b64);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
const figure = new THREE.Group();
window.__WORKER_DATA__.prims.forEach(function(p){
  const pos = new Float32Array(b64ToU8(p.pos).buffer);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  if (p.nrm) {
    geo.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(b64ToU8(p.nrm).buffer), 3));
  } else {
    geo.computeVertexNormals();
  }
  const idxU8 = b64ToU8(p.idx);
  const idx = p.itype === 'u32' ? new Uint32Array(idxU8.buffer) : new Uint16Array(idxU8.buffer);
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  const col = new THREE.Color().setRGB(p.color[0], p.color[1], p.color[2]);
  const mesh = new THREE.Mesh(geo, new THREE.MeshToonMaterial({ color: col }));
  figure.add(mesh);
  if (p.size > 0.15) {
    const o = new THREE.Mesh(geo, OUTLINE);
    o.scale.setScalar(1.05);
    mesh.add(o);
  }
});
scene.add(figure);

/* ---- 交互 ---- */
const target = new THREE.Vector3(0, 1.55, 0);
let yaw = 0, pitch = 0.08, dist = 6.2;
let yawT = 0, pitchT = 0.08, distT = 6.2;
let autoSpin = true, dragging = false, px = 0, py = 0;

const dom = renderer.domElement;
dom.style.cursor = 'grab';
dom.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; dom.style.cursor = 'grabbing'; });
window.addEventListener('pointerup',   () => { dragging = false; dom.style.cursor = 'grab'; });
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  yawT   += (e.clientX - px) * 0.008;
  pitchT += (e.clientY - py) * 0.005;
  pitchT = Math.max(-0.3, Math.min(0.9, pitchT));
  px = e.clientX; py = e.clientY;
  autoSpin = false; syncSpinBtn();
});
dom.addEventListener('wheel', e => {
  e.preventDefault();
  distT = Math.max(3.5, Math.min(10, distT + e.deltaY * 0.004));
}, { passive:false });

document.querySelectorAll('#views button[data-yaw]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#views button[data-yaw]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    yawT = parseFloat(btn.dataset.yaw) * Math.PI / 180;
    pitchT = 0.08; distT = 6.2;
  });
});
const spinBtn = document.getElementById('spin');
function syncSpinBtn(){ spinBtn.textContent = '自动旋转：' + (autoSpin ? '开' : '关'); }
spinBtn.addEventListener('click', () => { autoSpin = !autoSpin; syncSpinBtn(); });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function tick(){
  requestAnimationFrame(tick);
  if (autoSpin && !dragging) yawT += 0.005;
  yaw   += (yawT - yaw) * 0.1;
  pitch += (pitchT - pitch) * 0.1;
  dist  += (distT - dist) * 0.1;
  camera.position.set(
    target.x + dist * Math.cos(pitch) * Math.sin(yaw),
    target.y + dist * Math.sin(pitch),
    target.z + dist * Math.cos(pitch) * Math.cos(yaw)
  );
  camera.lookAt(target);
  renderer.render(scene, camera);
}
tick();
})();
</script>
