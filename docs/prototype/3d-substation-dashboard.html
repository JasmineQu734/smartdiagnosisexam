const MAT = {};
function mat(c) { if (!MAT[c]) MAT[c] = new THREE.MeshLambertMaterial({ color: c }); return MAT[c]; }
function box(w, h, d, c, x = 0, y = 0, z = 0, p) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c));
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  if (p) p.add(m); return m;
}
function cyl(rt, rb, h, c, x = 0, y = 0, z = 0, p, seg = 12) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat(c));

function wire(p1, p2, sag = 1.2, c = 0x46536b, r = 0.045) {

  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 18, r, 5), mat(c));
  scene.add(m); return m;
}

  }
}

    box(w, 0.12, 0.12, steelC, 0, y, wB / 2 - (wB - wT) * y / H / 2, g);
    box(w, 0.12, 0.12, steelC, 0, y, -(wB / 2 - (wB - wT) * y / H / 2), g);
    box(0.12, 0.12, w, steelC, wB / 2 - (wB - wT) * y / H / 2, y, 0, g);
    box(0.12, 0.12, w, steelC, -(wB / 2 - (wB - wT) * y / H / 2), y, 0, g);

  box(7.5, 0.22, 0.22, steelC, 0, H + 1.2, 0, g);
  box(5.0, 0.22, 0.22, steelC, 0, H + 3.2, 0, g);

}

function anchorPos(dev) {
  const p = new THREE.Vector3();
  dev.anchor ? dev.anchor.getWorldPosition(p) : p.set(0, 1, 0);
  return p;
}
function runOp(dev, key) {
  const p = anchorPos(dev);
  const t = p.clone(); t.y += 3;
  switch (key) {
    case 'fanOn':
      state.fan[dev.id] = true;
      toast('冷却风机已启动，油温开始下降');
      pushEvent(dev.name + ' 冷却风机启动（CJ6 机构）', true); break;
    case 'fanOff':
      state.fan[dev.id] = false;
      toast('冷却风机已停止，注意油温上升趋势');
      pushEvent(dev.name + ' 冷却风机停止，转自冷运行', true); break;
    case 'tapUp': case 'tapDown': {
      const step = key === 'tapUp' ? 1 : -1;
      const next = Math.min(17, Math.max(1, state.tap[dev.id] + step));
      if (next === state.tap[dev.id]) { toast('已到极限档位，禁止继续调压'); return; }
      state.tap[dev.id] = next;
      setParam(dev, 3, next);
      const v = (110 + (next - 9) * 0.625).toFixed(1);
      setParam(dev, 0, v);
      toast('有载调压至 ' + next + ' 档，母线电压 ' + v + ' kV');
      pushEvent(dev.name + ' 有载调压' + (step > 0 ? '升' : '降') + '至 ' + next + ' 档', true);
      flashAt(t, 0x9ec5ff, 0.9); break;
    }
    case 'close':
      if (state.breakerClosed) { toast('断路器已在合位，无需重复操作'); return; }
      state.breakerClosed = true;
      setParam(dev, 3, '合位'); setStatus(dev, '运行', '#22b573');
      lampRefs.breaker.material.color.setHex(0x22b573);
      flashAt(t, 0x9fe8c4, 1.4);
      toast('断路器合闸成功，线路送电');
      pushEvent(dev.name + ' 合闸送电（操作票 DZ-20261019-07）', true); break;
    case 'open':
      if (!state.breakerClosed) { toast('断路器已在分位'); return; }
      state.breakerClosed = false;
      setParam(dev, 3, '分位'); setStatus(dev, '热备用', '#f59e0b');
      lampRefs.breaker.material.color.setHex(0xef4444);
      flashAt(t, 0xffcf7a, 1.1);
      toast('断路器分闸，线路转热备用');
      pushEvent(dev.name + ' 分闸（负荷电流已转移）', true); break;
    case 'dsOpen': case 'dsClose': {
      const want = key === 'dsClose';
      if (want === state.dsClosed) { toast(want ? '主刀已在合位' : '主刀已在分位'); return; }
      if (want && state.breakerClosed) {
        toast('⚠ 五防闭锁：断路器在合位，禁止操作隔离开关');
        pushEvent('五防闭锁拦截：带负荷操作隔离开关', true); return;

const tweenList = [];
function animateDs(closed) {
  dsGroups.forEach(gp => {
    const fromL = gp.left.rotation.y, fromR = gp.right.rotation.y;

    const toR = closed ? 0 : -Math.PI / 2 * 0.92;
    tweenList.push({ t: 0, dur: 1.1, fn: k => { gp.left.rotation.y = fromL + (toL - fromL) * k; gp.right.rotation.y = fromR + (toR - fromR) * k; } });

    <div class="dotst" style="background:${d.stColor};box-shadow:0 0 6px ${d.stColor}"></div>`;
  row.onclick = () => selectDevice(d);
  devList.appendChild(row);
});
function renderParams(d) {
  document.getElementById('dParams').innerHTML = d.params.map(p =>
    `<div class="param"><div class="k">${p[0]}</div><div class="v">${p[1]}<b> ${p[2]}</b></div></div>`).join('');
}
function selectDevice(d) {
  selected = d;
  document.getElementById('overview').style.display = 'none';
  const det = document.getElementById('detail');
  det.classList.add('show');
  document.getElementById('dIc').textContent = d.ic;
  document.getElementById('dIc').className = 'ic ' + d.color;
  document.getElementById('dNm').textContent = d.name;
  document.getElementById('dEn').textContent = d.en;
  renderParams(d);
  document.getElementById('dOps').innerHTML = (OPS[d.id] || []).map(([label, key]) =>
    `<button class="op ${key === 'open' || key === 'dsOpen' ? 'danger' : ''}" data-key="${key}">${label}</button>`).join('');
  document.querySelectorAll('#dOps .op').forEach(btn => {
    btn.onclick = () => runOp(d, btn.dataset.key);
  });
  document.getElementById('dLearn').innerHTML = d.learn.map(x => `<li>${x}</li>`).join('');
  document.getElementById('dCourses').innerHTML = d.courses.map(c =>
    `<div class="course"><span class="tag">${c[1]}</span>${c[0]}<span class="go">→</span></div>`).join('');
  det.querySelector('.back').onclick = () => {
    det.classList.remove('show');
    document.getElementById('overview').style.display = '';
    selected = null;
  };
  document.querySelectorAll('.dev-row').forEach(r => r.classList.remove('active'));
  const row = document.getElementById('row-' + d.id);
  if (row) row.classList.add('active');
  if (d.anchor) {
    const p = new THREE.Vector3(); d.anchor.getWorldPosition(p);
    controls.target.copy(p);
    camTween(p.clone().add(new THREE.Vector3(9, 9, 11)));
  }
}
let camAnim = null;
function camTween(to) { camAnim = { from: camera.position.clone(), to, t: 0 }; }
document.querySelector('.back')?.addEventListener('click', () => { camTween(new THREE.Vector3(46, 36, 52)); controls.target.set(0, 2, 0); });

/* KPI + 油温联动 */
let kpiT = 0;
function tickData() {
  kpiT++;
  const load = (62 + Math.sin(kpiT / 4) * 4 + Math.random()).toFixed(1);
  document.getElementById('k3').innerHTML = load + '<b>%</b><span class="trend ' + (load > 63 ? 'up' : 'down') + '">' + (load > 63 ? '▲' : '▼') + Math.abs(load - 63.2).toFixed(1) + '</span>';
  document.getElementById('k2').innerHTML = (98 + Math.random() * 1.4).toFixed(1) + '<b>%</b><span class="trend flat">—</span>';
  ['transformer1', 'transformer2'].forEach(id => {
    const dev = DEVICES.find(x => x.id === id);
    const cur = parseFloat(dev.params[2][1]);
    const target = state.fan[id] ? 58 : 72;
    const next = cur + (target - cur) * 0.02 + (Math.random() - 0.5) * 0.15;
    dev.params[2][1] = next.toFixed(1);
  });
  if (selected && selected.id.startsWith('transformer')) renderParams(selected);
}
setInterval(tickData, 2500);

/* 作业步骤 */
const STEPS = ['核对定值单', '布置安全措施', '验电', '合接地刀闸', '悬挂标示牌', '工作许可'];
let stepNow = 2;
const stepsEl = document.getElementById('steps');
STEPS.forEach((s, i) => {
  if (i > 0) { const line = document.createElement('div'); line.className = 'stp-line'; stepsEl.appendChild(line); }
  const el = document.createElement('div');
  el.className = 'stp'; el.innerHTML = `<div class="b">${i + 1}</div>${s}`;
  stepsEl.appendChild(el);
});
function paintSteps() {
  [...stepsEl.querySelectorAll('.stp')].forEach((el, i) => {
    el.classList.toggle('done', i < stepNow);
    el.classList.toggle('now', i === stepNow);
    el.querySelector('.b').textContent = i < stepNow ? '✓' : i === stepNow ? '●' : i + 1;
  });
  [...stepsEl.querySelectorAll('.stp-line')].forEach((el, i) => el.classList.toggle('done', i < stepNow));
}
paintSteps();
setInterval(() => { stepNow = (stepNow + 1) % STEPS.length; paintSteps(); }, 12000);
let etaS = 1122;
setInterval(() => {
  etaS = Math.max(0, etaS - 1);
  document.getElementById('eta').textContent = Math.floor(etaS / 60) + ':' + String(etaS % 60).padStart(2, '0');
}, 1000);

/* ═══════════════════ 动画 ═══════════════════ */
const ROBOT_PATH = [[24, 24], [24, 6], [6, -3], [-10, -1], [-22, 4], [-10, 12], [4, 15], [24, 24]];
let pathSeg = 0, pathT = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = 0.016, t = performance.now() / 1000;
  fans.forEach(f => { if (state.fan[f.owner]) f.mesh.rotation.z += dt * 5; });
  if (state.robotRun) {
    pathT += dt * 0.10;
    if (pathT >= 1) { pathT = 0; pathSeg = (pathSeg + 1) % (ROBOT_PATH.length - 1); }
  }
  const a = ROBOT_PATH[pathSeg], b = ROBOT_PATH[pathSeg + 1];
  robot.position.x = a[0] + (b[0] - a[0]) * pathT;
  robot.position.z = a[1] + (b[1] - a[1]) * pathT;
  if (state.robotRun) robot.rotation.y = Math.atan2(b[0] - a[0], b[1] - a[1]);
  roboLight.material.color.setHex(state.robotRun && Math.sin(t * 6) > 0 ? 0x22b573 : 0x14532d);
  cars.forEach(c => {
    c.g.position.x += c.dir * dt * 9;
    if (c.g.position.x > 150) c.g.position.x = -150;
    if (c.g.position.x < -150) c.g.position.x = 150;
  });
  clouds.forEach((c, i) => { c.position.x += dt * (0.4 + i * 0.05); if (c.position.x > 200) c.position.x = -200; });
  if (ring.visible) ring.material.opacity = 0.5 + Math.sin(t * 4) * 0.3;
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i]; f.t += dt;
    f.m.scale.setScalar(1 + f.t * 2.2);
    f.m.material.opacity = Math.max(0, 0.9 - f.t * 1.6);
    if (f.t > 0.6) { scene.remove(f.m); flashes.splice(i, 1); }
  }
  for (let i = tweenList.length - 1; i >= 0; i--) {
    const tw = tweenList[i]; tw.t += dt;
    const k = Math.min(1, tw.t / tw.dur);
    tw.fn(k * k * (3 - 2 * k));
    if (k >= 1) tweenList.splice(i, 1);
  }
  if (camAnim) {
    camAnim.t += 0.045;
    const k = 1 - Math.pow(1 - Math.min(1, camAnim.t), 2);
    camera.position.lerpVectors(camAnim.from, camAnim.to, k);
    if (camAnim.t >= 1) camAnim = null;
  }
  controls.update();
  renderer.render(scene, camera);
}
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}
window.addEventListener('resize', resize);
resize();
animate();
</script>
